<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f4f8f3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 450px;
            border-radius: 15px;
        }

        .login-title {
            color: #1b5e20;
            font-weight: bold;
        }

        .btn-login {
            background: #1b5e20;
            color: white;
        }

        .btn-login:hover {
            background: #2e7d32;
            color: white;
        }

        .language-box {
            margin-bottom: 20px;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="card login-card shadow-lg p-4 p-md-5">

        <!-- LANGUAGE SELECTOR -->

        <div class="language-box">

            <label class="form-label fw-bold">
                🌐 {{ t.select_language }}
            </label>

            <select
                class="form-select"
                onchange="changeLanguage(this.value)"
            >

                {% for language in languages %}

                    <option
                        value="{{ language }}"
                        {% if language == current_language %}
                            selected
                        {% endif %}
                    >
                        {{ language }}
                    </option>

                {% endfor %}

            </select>

        </div>


        <!-- TITLE -->

        <h2 class="text-center login-title mb-3">

            🔐 Admin Login

        </h2>


        <p class="text-center text-muted mb-4">

            {{ t.title }}

        </p>


        <!-- LOGIN FORM -->

        <form method="POST">


            <!-- USERNAME -->

            <div class="mb-3">

                <label class="form-label fw-bold">

                    👤 Username

                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter username"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="mb-4">

                <label class="form-label fw-bold">

                    🔑 Password

                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter password"
                    required
                >

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="btn btn-login w-100 py-2"
            >

                🔐 Login

            </button>


        </form>


        <!-- BACK BUTTON -->

        <a
            href="{{ url_for('home') }}"
            class="btn btn-outline-secondary w-100 mt-3"
        >

            ← Back

        </a>

    </div>

</div>


<script>

function changeLanguage(language) {

    window.location.href =
        "/set_language/" + encodeURIComponent(language);

}

</script>


</body>

</html>
