<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7f6;
        }

        .register-card {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 15px;
            background: white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .title {
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .btn-register {
            width: 100%;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="register-card">

        <h2 class="title">👤 User Registration</h2>

        <p class="text-center text-muted">
            Create an account to report suspicious seeds or fertilizers.
        </p>

        {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="Enter your name"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Mobile Number</label>
                <input
                    type="tel"
                    name="mobile"
                    class="form-control"
                    placeholder="Enter mobile number"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email address"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Create a password"
                    minlength="6"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Village</label>
                <input
                    type="text"
                    name="village"
                    class="form-control"
                    placeholder="Enter your village"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Mandal</label>
                <input
                    type="text"
                    name="mandal"
                    class="form-control"
                    placeholder="Enter your mandal"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">District</label>
                <input
                    type="text"
                    name="district"
                    class="form-control"
                    placeholder="Enter your district"
                    required>
            </div>

            <button type="submit" class="btn btn-success btn-register">
                Create Account
            </button>

        </form>

        <div class="text-center mt-3">

            <a href="{{ url_for('user_login') }}">
                Already have an account? Login
            </a>

        </div>

        <div class="text-center mt-2">

            <a href="{{ url_for('home') }}">
                ← Back to Home
            </a>

        </div>

    </div>

</div>

</body>
</html>
